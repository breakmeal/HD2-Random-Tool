<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">敌军战场终端背景</title>
  <desc id="desc">暗色烟尘中交错出现虫族、机器人与光能者的抽象轮廓。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a08"/>
      <stop offset=".52" stop-color="#121b16"/>
      <stop offset="1" stop-color="#28120f"/>
    </linearGradient>
    <radialGradient id="warning" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#b5472d" stop-opacity=".56"/>
      <stop offset=".45" stop-color="#5b2019" stop-opacity=".25"/>
      <stop offset="1" stop-color="#050706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="energy" cx="42%" cy="34%" r="42%">
      <stop offset="0" stop-color="#61e3ed" stop-opacity=".4"/>
      <stop offset=".38" stop-color="#24535b" stop-opacity=".18"/>
      <stop offset="1" stop-color="#07100e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161c17"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <filter id="blur24"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="blur10"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#d9e4d4" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#warning)"/>
  <rect width="1600" height="900" fill="url(#energy)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <g opacity=".34" filter="url(#blur24)" fill="#8fa392">
    <ellipse cx="420" cy="500" rx="330" ry="110"/>
    <ellipse cx="990" cy="420" rx="390" ry="120"/>
    <ellipse cx="1320" cy="620" rx="310" ry="105"/>
  </g>

  <path d="M0 690 180 626l176 48 161-79 190 67 150-58 204 75 180-54 359 93v182H0Z" fill="url(#ground)"/>
  <path d="M0 724 218 664l214 77 215-44 246 83 231-66 476 106v80H0Z" fill="#050706" opacity=".9"/>

  <!-- Illuminate energy construct -->
  <g transform="translate(455 205)" opacity=".72">
    <ellipse cx="0" cy="0" rx="78" ry="32" fill="none" stroke="#65dbe5" stroke-width="5" filter="url(#glowCyan)"/>
    <path d="M-62 2 0 145 62 2M0 145-82 350M0 145 7 376M0 145l105 205" fill="none" stroke="#3d7e83" stroke-width="18" stroke-linecap="round"/>
    <circle cx="0" cy="64" r="20" fill="#8ff4f2" filter="url(#glowCyan)"/>
    <path d="M-118 90Q0 24 118 90M-142 128Q0 56 142 128" fill="none" stroke="#66dfe8" stroke-opacity=".4" stroke-width="3"/>
  </g>

  <!-- Automaton command silhouette -->
  <g transform="translate(905 190)" opacity=".88">
    <path d="M-120 80-82 0H82l38 80 50 62-24 271-96 72H-50l-96-72-24-271Z" fill="#080b09" stroke="#4a211c" stroke-width="8"/>
    <path d="M-78 132h52l18 27-23 18h-62ZM78 132H26L8 159l23 18h62Z" fill="#ff4b35" filter="url(#glowRed)"/>
    <path d="M-96 230h192M-80 278h160M-55 326H55" stroke="#43231d" stroke-width="13"/>
    <path d="M-144 155-240 235l54 42 57-37M144 155l96 80-54 42-57-37" fill="#0a0d0b" stroke="#34211c" stroke-width="10"/>
    <circle cx="0" cy="405" r="26" fill="#9e3428" opacity=".72" filter="url(#glowRed)"/>
  </g>

  <!-- Terminid titan silhouette -->
  <g transform="translate(1300 360)" fill="#070907" stroke="#564529" stroke-width="9" stroke-linejoin="round" opacity=".94">
    <path d="M-175 75-92-36-9-76 91-48 165 34 130 116 39 146-64 130Z"/>
    <path d="M-86-31-180-155-256-181-216-101-157 8M73-43l101-122 82-9-44 78-69 105"/>
    <path d="M-102 108-238 268-312 428M-37 132-120 333-156 482M62 123l74 209 31 149M117 87l171 170 93 157" fill="none" stroke-width="23" stroke-linecap="round"/>
    <path d="M-13-65 18-121 48-55 22-12Z" fill="#d7a82e" stroke="none" filter="url(#blur10)"/>
    <path d="M-190 61-280 21M149 50l104-55" fill="none" stroke="#776037" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g opacity=".22" stroke="#f4d34e" stroke-width="2">
    <path d="M78 175h310M1200 120h310M1010 582h430"/>
    <path d="M78 175v44M388 175v44M1200 120v44M1510 120v44M1010 582v44M1440 582v44"/>
  </g>
  <rect width="1600" height="900" fill="none" stroke="#d4bd54" stroke-opacity=".13" stroke-width="6"/>
</svg>
